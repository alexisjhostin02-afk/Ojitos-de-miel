<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosas Bonitas - Ojitos de Miel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: radial-gradient(circle at center, #1b263b, #0f172a, #050814);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    /* Contenedor central con scroll suave para frases */
    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      scrollbar-width: none;
    }
    .container::-webkit-scrollbar {
      display: none;
    }

    /* Estilo de la frase principal */
    .title-main {
      font-size: 2.8rem;
      font-weight: 900;
      color: #fbbf24;
      text-shadow: 0 0 20px rgba(251, 191, 36, 0.8), 0 0 30px rgba(245, 158, 11, 0.6);
      margin: 25px 0;
      letter-spacing: 2px;
      animation: pulse 2s infinite alternate;
    }

    /* Estilos de las frases bonitas */
    .phrase {
      font-size: 1.4rem;
      color: #fef08a;
      margin: 14px 0;
      font-weight: 600;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s forwards;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .phrase.highlight {
      font-size: 1.8rem;
      color: #f59e0b;
      font-weight: 800;
    }

    /* Corazones y destellos flotantes en el fondo */
    .particle {
      position: absolute;
      pointer-events: none;
      animation: floatUp linear infinite;
      opacity: 0.7;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0% { transform: scale(1); text-shadow: 0 0 15px rgba(251, 191, 36, 0.7); }
      100% { transform: scale(1.05); text-shadow: 0 0 30px rgba(251, 191, 36, 1); }
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% {
        transform: translateY(-10vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container" id="phrasesContainer">
    <!-- Las frases se generan dinámicamente con tiempos escalonados -->
  </div>

  <script>
    const phrases = [
      "Eres mi sol ☀️",
      "Tu sonrisa ilumina todo ✨",
      "Cada día te quiero más ❤️",
      "Hermosa por dentro y por fuera 🌟",
      "Contigo la vida es dulce como miel 🍯",
      "¡OJITOS DE MIEL! 👀💛",
      "Gracias por existir 🥰",
      "Tu mirada es mi paz 🕊️",
      "Increíble y maravillosa 💖",
      "Siempre juntos 👩‍❤️‍👨",
      "Amor eterno ♾️",
      "Tus ojos, mi refugio 🏠✨",
      "Delicada y fuerte 💪🌸",
      "Todo mi corazón para ti 💓",
      "¡OJITOS DE MIEL! 👀💛"
    ];

    const container = document.getElementById("phrasesContainer");

    // Agregar frases con retraso en la animación
    phrases.forEach((text, index) => {
      const p = document.createElement("p");
      p.className = "phrase";
      if (text.includes("OJITOS DE MIEL")) {
        p.className += " title-main";
      } else if (index % 3 === 0) {
        p.className += " highlight";
      }
      p.innerText = text;
      p.style.animationDelay = `${index * 0.25}s`;
      container.appendChild(p);
    });

    // Crear corazones y destellos flotantes
    function createParticle() {
      const particle = document.createElement("div");
      particle.className = "particle";
      
      const isHeart = Math.random() > 0.3;
      particle.innerText = isHeart ? "💛" : "✨";
      particle.style.fontSize = `${Math.random() * 20 + 15}px`;
      particle.style.left = `${Math.random() * 100}vw`;
      
      const duration = Math.random() * 5 + 5;
      particle.style.animationDuration = `${duration}s`;

      document.body.appendChild(particle);

      setTimeout(() => {
        particle.remove();
      }, duration * 1000);
    }

    setInterval(createParticle, 300);
  </script>
</body>
</html>
